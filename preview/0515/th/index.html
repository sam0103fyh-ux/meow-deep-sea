function wxDefCity(){return LANG==='ja'?'tyo':LANG==='th'?'bkk':'hk';}

let WX=null;try{WX=JSON.parse(localStorage.getItem('mmsea_wx')||'null');}catch(e){}
function wxKind(c){return c===0?'sun':c<=3?'cloud':c<=48?'fog':c<=67||(c>=80&&c<=82)?'rain':c<=77||c===85||c===86?'snow':c>=95?'storm':'cloud';}
const WX_IC={sun:'☀️',cloud:'⛅',fog:'🌫️',rain:'🌧️',snow:'❄️',storm:'⛈️'};
let wxBusy=0;
function wxFetch(lat,lon,name,src){if(wxBusy)return;wxBusy=1;const ctl=window.AbortController?new AbortController():null;const to=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},8000);
fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat.toFixed(2)+'&longitude='+lon.toFixed(2)+'&current=temperature_2m,weather_code&timezone=auto',ctl?{signal:ctl.signal}:{}).then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.current)return;WX={t:Math.round(j.current.temperature_2m),c:j.current.weather_code|0,n:name,src,at:Date.now()};try{localStorage.setItem('mmsea_wx',JSON.stringify(WX));}catch(e){}}).catch(()=>{}).finally(()=>{clearTimeout(to);wxBusy=0;});}
function wxCityFetch(){const k=wxCity(),c=WX_C[k];wxFetch(c[1],c[2],k,'city');}
function wxUpdate(force){if(cfg.wxOff)return;if(!force&&WX&&Date.now()-WX.at<30*60e3)return;
if(cfg.geo&&cfg.geo.lat!=null){wxFetch(cfg.geo.lat,cfg.geo.lon,'near','geo');return;}
if(!cfg.geoAsked&&navigator.geolocation){cfg.geoAsked=1;saveCfg();try{navigator.geolocation.getCurrentPosition(p=>{cfg.geo={lat:p.coords.latitude,lon:p.coords.longitude};saveCfg();wxFetch(cfg.geo.lat,cfg.geo.lon,'near','geo');},()=>wxCityFetch(),{timeout:8000,maximumAge:3600e3});}catch(e){wxCityFetch();}return;}
wxCityFetch();}
function wxPlace(){if(!WX)return'';return WX.n==='near'?'ใกล้ ๆ เธอ':(WX_C[WX.n]?WX_C[WX.n][0]:'');}
function wxLines(){if(!WX)return[];const k=wxKind(WX.c),t=WX.t,a=['วันนี้ %s องศา เหมียว'.replace('%s',t)];
if(t>=30)a.push('ร้อนมาก ดื่มน้ำเยอะ ๆ นะ เหมียว');else if(t<=15)a.push('หนาวนิดหน่อย ใส่เสื้อเพิ่มนะ เหมียว');

function hdRR(x,y,w,h,r){hx.beginPath();hx.moveTo(x+r,y);hx.arcTo(x+w,y,x+w,y+h,r);hx.arcTo(x+w,y+h,x,y+h,r);hx.arcTo(x,y+h,x,y,r);hx.arcTo(x,y,x+w,y,r);hx.closePath();}
