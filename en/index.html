function buildSub(f,c){const cat=CATS[c.cat]||CATS[0],C=COLORS[c.color],A=ACC[C],D=MD[c.model]||MD[0];
const prop=c.prop===2?['S','S']:c.prop===1?(f%2?['k','A']:['A','k']):(f%2?['.','k']:['k','.']);
let r=D.t.map(x=>x.split(''));const set=(x,y,v)=>{if(y>=0&&y<16&&x>=0&&x<16)r[y][x]=v;};
for(let j=0;j<4;j++)for(let i=0;i<6;i++)r[D.fy+j][D.fx+i]=c.empty?(j===0&&i===3?'w':'c'):cat.f[j][i];
for(let y=0;y<16;y++)for(let x=0;x<16;x++){const v=r[y][x];if(v==='P')r[y][x]=prop[0];else if(v==='Q')r[y][x]=prop[1];else if(v==='R')r[y][x]=(x+f)%2?'S':'k';}
if(f%2)set(D.tail[0]+1,D.tail[1],'T');
if(c.decal===1){for(const y of D.st)for(let x=0;x<16;x++)if(r[y][x]==='C')r[y][x]='w';}
if(c.decal===2){let n=0,i=0;for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(r[y][x]==='C'){if(i++%6===2&&n<5){r[y][x]='w';n++;}}}
if(c.decal===3){for(const[x,y]of D.ears){set(x,y,'A');set(x,y-1,'k');set(x+1,y,'k');}}
if(c.prop===1&&f%2){set(15,D.pr-1,'k');set(15,D.pr+2,'k');}
return spr(r.map(x=>x.join('').replace(/C/g,C).replace(/A/g,A).replace(/T/g,cat.t)));}
