<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>喵喵深海尋珠記</title>
<style>html,body{margin:0;height:100%;background:#0b2a4a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}</style></head>
<body><noscript><p style="color:#fff;font:16px sans-serif;padding:20px">呢個檢視器唔支援 JavaScript，請用 Chrome / Safari 開啟呢個檔案。</p></noscript><canvas id="c"></canvas>
<script>
"use strict";
const W=160,H=240,T=16;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1;
function resize(){const d=window.devicePixelRatio||1;S=Math.max(1,Math.floor(Math.min(innerWidth*d/W,innerHeight*d/H)));
cv.width=W*S;cv.height=H*S;cv.style.width=(W*S/d)+'px';cv.style.height=(H*S/d)+'px';
cv.style.left=((innerWidth-W*S/d)/2)+'px';cv.style.top=((innerHeight-H*S/d)/2)+'px';ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();
// palette (bright, cheerful)
const P={k:'#1a1c2c',w:'#f4f4f4',o:'#ef7d57',y:'#ffcd75',g:'#a7f070',G:'#38b764',c:'#73eff7',b:'#41a6f6',B:'#3b5dc9',d:'#29366f',p:'#ff77a8',m:'#b13e53',s:'#94b0c2',S:'#566c86',v:'#c58cf7',l:'#ffe8f0'};
function spr(rows){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');
rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.'){x.fillStyle=P[ch];x.fillRect(i,j,1,1);}}});return c;}
// cat-in-sub frames (16x16), 4 frames: propeller + bob handled by offset
function subFrame(f){const prop=['k.','.k','k.','.k'][f];const tail=f%2?'yy':'y.';
return spr([
'......kkkk......',
'.....kccwck.....',
'....kcoyoyck....',
'....kcyyyyck....',
'....kcykykck....',
'....kcyppyck....',
'..kkkkkkkkkkkk..',
'.kyyyyyyyyyyyyk.',
'kyyoyyyyyyyyoyyk',
'kyyyyykkkyyyyy'+prop,
'kyyyyykwkyyyyy'+prop.split('').reverse().join(''),
'kyoyyyykyyyyoyk.',
'.kyyyyyyyyyyyyk.',
'..kkkkkkkkkkkk..',
'...k'+tail+'......k...',
'................']);}
const SUB=[0,1,2,3].map(subFrame);
function fishF(f){return spr(['................','................','................','.......kk.......','....kkkook...k..','...koooooyk.kok.','..kowkoooook'+(f%2?'ook.':'oook'),'..kokkooooo'+(f%2?'kook.':'kook').slice(0,5),'..kooooooooooook','...koooooyk.kok.','....kkkook...k..','.......kk.......','................','................','................','................'].map(r=>r.padEnd(16,'.').slice(0,16)));}
const FISH=[0,1,2,3].map(fishF);
function jellyF(f){const t=['.k.k.k.k.','k.k.k.k.k'][f%2];return spr(['................','.....kkkkkk.....','....kvvvvvvk....','...kvlvvvvvvk...','...kvvvvvvvvk...','...kvkvvvkvvk...','...kvvvvvvvvk...','...kkkkkkkkkk...','....p.p..p.p....','....'+(f%2?'.p.p..p.p':'p.p..p.p.')+'...','....p.p..p.p....','...'+(f<2?'.p.p..p.p.':'p.p..p.p..')+'...','....p.p..p.p....','................','................','................'].map(r=>r.padEnd(16,'.').slice(0,16)));}
const JELLY=[0,1,2,3].map(jellyF);
function sharkF(f){return spr(['................','......kk........','.....ksk........','....kssk........','..kkkssskkkk....','.ksssssssssskk.k','kswksssssssssksk','ksssssssssss'+(f%2?'kssk':'ksk.'),'.kwwwwwwwssskksk','..kkwkwkkkkk..k.','....kkk.........','................','................','................','................','................'].map(r=>r.padEnd(16,'.').slice(0,16)));}
const SHARK=[0,1,2,3].map(sharkF);
const PEARL=spr(['................','................','................','................','.....kkkkkk.....','....kllwwllk....','...kllwwlllpk...','...kllllllllk...','...klllllllpk...','...kplllllppk...','....kpllpppk....','.....kkkkkk.....','................','................','................','................']);
const BUB=spr(['................','................','.....cccccc.....','....c......c....','...c..ww....c...','...c.w......c...','...c........c...','...c........c...','...c........c...','...c........c...','....c......c....','.....cccccc.....','................','................','................','................']);
const HEART=spr(['.kk.kk.','kppkppk','kpppppk','.kpppk.','..kpk..','...k...']);
// pixel font 3x5
const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111','m':'000000111111101',':':'000010000010000'};
function num(s,x,y,col){s=String(s);for(const ch of s){const f=FONT[ch];if(f){ctx.fillStyle=col;for(let i=0;i<15;i++)if(f[i]==='1')ctx.fillRect(x+i%3,y+(i/3|0),1,1);}x+=4;}}
function txt(s,x,y,size,col,align){ctx.font=`bold ${size}px sans-serif`;ctx.textAlign=align||'center';ctx.textBaseline='top';
ctx.fillStyle=P.k;for(const[dx,dy] of[[1,0],[-1,0],[0,1],[0,-1]])ctx.fillText(s,x+dx,y+dy);ctx.fillStyle=col;ctx.fillText(s,x,y);}
// background layers (tile-based seabed, rocks, kelp)
function mkLayer(seed,col,col2,h,kelp){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');let r=seed;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
for(let i=0;i<W;i+=T){const top=H-h-((rnd()*3)|0)*8;x.fillStyle=col;x.fillRect(i,top,T,H);x.fillStyle=col2;x.fillRect(i,top,T,2);x.fillRect(i+4,top+6,3,2);
if(kelp&&rnd()<.5){for(let k=0;k<40;k+=4){x.fillStyle=k%8?P.G:P.g;x.fillRect(i+6+((k/4)%2?1:-1),top-k-4,3,4);}}}
return c;}
const L1=mkLayer(7,'#22406e','#2b5280',70,false),L2=mkLayer(13,'#1f6b7a','#2f8a8a',45,true),L3=mkLayer(29,P.y,P.o,18,false);
// sound (tiny webaudio)
let AC=null;function beep(f,d,t){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
// state
let state='title',tick=0,best=(()=>{try{return +(localStorage.getItem('mmsea_best')||0)}catch(e){return 0}})(),G;
function newGame(){G={x:72,y:70,vx:0,vy:0,hp:3,o2:100,score:0,depth:0,inv:0,ents:[],parts:[],pops:[],spawn:0,speed:.5,newBest:false};}
newGame();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' '||e.key==='Enter')press();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
let touch=null,drag=null;
function cpos(p){const r=cv.getBoundingClientRect();return{x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H};}
let tiltOn=false,tiltX=0,tiltY=0,tsx=0,tsy=0,pendTog=false;
try{tiltOn=localStorage.getItem('mmsea_tilt')==='1'}catch(e){}
const BTN={x:40,y:126,w:80,h:16};
function inBtn(q){return state!=='play'&&q.x>=BTN.x&&q.x<=BTN.x+BTN.w&&q.y>=BTN.y&&q.y<=BTN.y+BTN.h;}
function saveTilt(){try{localStorage.setItem('mmsea_tilt',tiltOn?'1':'0')}catch(e){}}
function toggleTilt(){if(tiltOn){tiltOn=false;saveTilt();return;}
const D=window.DeviceOrientationEvent;
if(D&&typeof D.requestPermission==='function'){D.requestPermission().then(r=>{tiltOn=r!=='denied';saveTilt();}).catch(()=>{tiltOn=false;saveTilt();});}
else{tiltOn=!!D;saveTilt();}}
function dz(v){const a=Math.abs(v);if(a<4)return 0;return Math.sign(v)*Math.min(1,(a-4)/21);}
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;
const ang=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);
let x=e.gamma,y=e.beta-40;
if(ang===90){x=e.beta;y=-e.gamma-40;}else if(ang===270||ang===-90){x=-e.beta;y=e.gamma-40;}
tiltX=dz(x);tiltY=dz(y);});
function dStart(p){const q=cpos(p);if(inBtn(q)){pendTog=true;return;}drag={fx:q.x,fy:q.y,sx:G.x,sy:G.y,tx:G.x,ty:G.y};press();if(drag){drag.sx=G.x;drag.sy=G.y;drag.tx=G.x;drag.ty=G.y;}}
function dMove(p){if(!drag)return;const q=cpos(p);drag.tx=drag.sx+(q.x-drag.fx)*1.2;drag.ty=drag.sy+(q.y-drag.fy)*1.2;}
function dEnd(){drag=null;if(pendTog){pendTog=false;toggleTilt();}}
const opt={passive:false};
document.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();dStart(e.changedTouches[0]);},opt);
document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();dMove(e.touches[0]);},opt);
document.addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault();if(!e.touches.length)dEnd();},opt);
document.addEventListener('touchcancel',dEnd);
document.addEventListener('gesturestart',e=>e.preventDefault(),opt);
document.addEventListener('mousedown',e=>dStart(e));document.addEventListener('mousemove',e=>dMove(e));document.addEventListener('mouseup',dEnd);
function press(){if(state!=='play'){if(state==='over'&&tick<30)return;newGame();state='play';tick=0;beep(660,.15);}}
function rnd(a,b){return a+Math.random()*(b-a);}
function spawn(){const d=G.depth,r=Math.random();const diff=Math.min(1,d/1500);
let e;if(r<.28)e={t:'pearl',x:rnd(8,140),y:H+8,vx:0};
else if(r<.48)e={t:'fish',x:Math.random()<.5?-16:W,y:rnd(H*.5,H),vx:0};
else if(r<.58)e={t:'bub',x:rnd(8,140),y:H+8,vx:0};
else if(r<.58+.3+diff*.05)e={t:'jelly',x:rnd(4,140),y:H+8,vx:0,ph:Math.random()*6};
else e={t:'shark',x:Math.random()<.5?-20:W+4,y:rnd(H*.4,H-20),vx:0};
if(e.t==='fish')e.vx=e.x<0?rnd(.4,.8):-rnd(.4,.8);
if(e.t==='shark'&&diff<.15){e.t='jelly';e.x=rnd(4,140);e.y=H+8;e.ph=0;}
if(e.t==='shark')e.vx=(e.x<0?1:-1)*(1+diff*1.2);
G.ents.push(e);}
function burst(x,y,col,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:rnd(-1,1),vy:rnd(-1.4,.4),l:rnd(15,30),c:col});}
function update(){tick++;
if(state!=='play')return;
const diff=Math.min(1,G.depth/1500);G.speed=.5+diff*1.1;G.depth+=G.speed*.25;
let ax=0,ay=0;if(keys.arrowleft||keys.a)ax--;if(keys.arrowright||keys.d)ax++;if(keys.arrowup||keys.w)ay--;if(keys.arrowdown||keys.s)ay++;
if(tiltOn&&!drag){tsx+=(tiltX-tsx)*.15;tsy+=(tiltY-tsy)*.15;ax+=tsx;ay+=tsy;}
if(drag){drag.tx=Math.max(0,Math.min(W-16,drag.tx));drag.ty=Math.max(14,Math.min(H-16,drag.ty));const nx=G.x+(drag.tx-G.x)*.3,ny=G.y+(drag.ty-G.y)*.3;G.vx=nx-G.x;G.vy=ny-G.y;G.x=nx;G.y=ny;}else{
if(!drag)G.vx=(G.vx+ax*.3)*.86;G.vy=(G.vy+ay*.3)*.86;G.x=Math.max(0,Math.min(W-16,G.x+G.vx));G.y=Math.max(14,Math.min(H-16,G.y+G.vy));}
G.o2-=.07+diff*.05;if(G.inv>0)G.inv--;
if(tick%6===0)G.parts.push({x:G.x+1,y:G.y+10,vx:-.3,vy:-.5,l:20,c:P.c});
G.spawn-=1;if(G.spawn<=0){spawn();G.spawn=Math.max(14,46-diff*30)*rnd(.6,1.2);}
for(const e of G.ents){e.y-=G.speed;e.x+=e.vx;if(e.t==='jelly'){e.ph+=.05;e.y-=Math.sin(e.ph)*.4;}
if(e.t==='bub')e.y-=.3;
const hit=Math.abs(e.x+8-(G.x+8))<10&&Math.abs(e.y+8-(G.y+8))<9;
if(hit&&!e.dead){if(e.t==='pearl'){G.score+=10;e.dead=1;burst(e.x+8,e.y+8,P.l,10);G.pops.push({x:e.x+8,y:e.y,s:'+10',l:30});beep(1046,.1);}
else if(e.t==='fish'){G.score+=5;e.dead=1;burst(e.x+8,e.y+8,P.o,8);G.pops.push({x:e.x+8,y:e.y,s:'+5',l:30});beep(880,.08);}
else if(e.t==='bub'){G.o2=Math.min(100,G.o2+35);e.dead=1;burst(e.x+8,e.y+8,P.c,12);G.pops.push({x:e.x+8,y:e.y,s:'O2',l:30});beep(520,.12,'sine');}
else if(G.inv===0){G.hp--;G.inv=70;burst(G.x+8,G.y+8,P.p,16);beep(140,.25,'sawtooth');}}}
G.ents=G.ents.filter(e=>!e.dead&&e.y>-24&&e.x>-30&&e.x<W+30);
for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy-=.02;p.l--;}G.parts=G.parts.filter(p=>p.l>0);
for(const p of G.pops){p.y-=.4;p.l--;}G.pops=G.pops.filter(p=>p.l>0);
if(G.hp<=0||G.o2<=0){state='over';tick=0;G.score+=Math.floor(G.depth/10);if(G.score>best){best=G.score;G.newBest=true;try{localStorage.setItem('mmsea_best',best);}catch(e){}}beep(220,.4,'triangle');}}

// ===== visual decor (visual only, no gameplay effect) =====
const CLOWN=spr(['................','................','......kkk.......','....kkoookk.....','...kowwoowk.k...','..kkkkkkkkkkkok.','.kokkkokkkkkkook','.koowoooowooook.','..koowoooowook..','...kkoooookk.k..','.....kkkkk......','................','................','................','................','................']);
const GLOW=(()=>{const c=document.createElement('canvas');c.width=c.height=12;const x=c.getContext('2d');const g=x.createRadialGradient(6,6,0,6,6,6);g.addColorStop(0,'rgba(255,200,255,0.9)');g.addColorStop(.35,'rgba(197,140,247,0.5)');g.addColorStop(1,'rgba(197,140,247,0)');x.fillStyle=g;x.fillRect(0,0,12,12);return c;})();
function mkMtn(seed){const c=document.createElement('canvas');c.width=W;c.height=90;const x=c.getContext('2d');let r=seed;const R=()=>(r=(r*9301+49297)%233280)/233280;
x.fillStyle='#2a4f86';let h=40;for(let i=0;i<W;i+=4){h=Math.max(10,Math.min(80,h+(R()-.5)*16));x.fillRect(i,90-h,4,h);}
x.fillStyle='#335f9a';for(let i=0;i<W;i+=4)if(R()<.3)x.fillRect(i,60+R()*25,4,2);return c;}
const MTN=[mkMtn(3),mkMtn(17)];
function mkCoral(seed){const c=document.createElement('canvas');c.width=32;c.height=48;const x=c.getContext('2d');let r=seed;const R=()=>(r=(r*9301+49297)%233280)/233280;
x.fillStyle=P.S;x.fillRect(0,36,32,12);x.fillStyle=P.s;x.fillRect(0,36,32,2);
const cols=[P.p,P.o,P.v,P.y,P.m];for(let k=0;k<4;k++){const col=cols[(R()*5)|0];x.fillStyle=col;let px=4+R()*24|0,py=36;for(let j=0;j<8+R()*10;j++){x.fillRect(px,py,2,2);py-=2;px+=R()<.33?-1:R()<.5?1:0;if(R()<.2)x.fillRect(px+(R()<.5?-2:2),py,2,2);}}
return c;}
const CORALS=[1,5,9,23,42].map(mkCoral);
function mkWreck(kind){const c=document.createElement('canvas');c.width=48;c.height=32;const x=c.getContext('2d');const wood='#8b5a3c',dk='#5a3a28';
if(kind===0){x.fillStyle=dk;x.fillRect(4,14,40,12);x.fillStyle=wood;x.fillRect(6,12,36,10);x.fillStyle=dk;for(let i=8;i<40;i+=6)x.fillRect(i,12,1,10);x.fillStyle=P.k;x.fillRect(14,15,4,4);x.fillRect(28,15,4,4);x.fillStyle=wood;x.fillRect(22,0,3,12);x.fillStyle='#d8c8a8';x.fillRect(25,2,8,6);}
else if(kind===1){x.fillStyle=P.S;x.fillRect(22,2,4,22);x.fillRect(16,4,16,3);x.fillRect(12,20,24,3);x.fillRect(10,16,3,5);x.fillRect(35,16,3,5);x.fillStyle=P.s;x.fillRect(20,0,8,3);}
else{x.fillStyle=wood;x.fillRect(10,10,20,16);x.fillStyle=dk;x.fillRect(10,10,20,2);x.fillRect(10,17,20,1);x.fillStyle=P.y;x.fillRect(18,14,4,4);x.fillStyle=P.y;x.fillRect(32,22,3,3);x.fillRect(36,24,3,3);}
return c;}
const WRECK=[0,1,2].map(mkWreck);
let decor=[],dSpawn=0,lastDepth=0,egg=null,stars=[];
function seedDecor(){decor=[];for(let y=0;y<H;y+=60)spawnDecor(y);}
function spawnDecor(y){const r=Math.random();
if(r<.25)decor.push({t:'mtn',im:MTN[(Math.random()*2)|0],x:0,y:y==null?H:y,f:.25});
else if(r<.6)decor.push({t:'coral',im:CORALS[(Math.random()*5)|0],x:Math.random()<.5?-6:W-26,y:y==null?H:y,f:.8});
else if(r<.8)decor.push({t:'wreck',im:WRECK[(Math.random()*3)|0],x:Math.random()<.5?-8:W-40,y:y==null?H:y,f:.55});
else decor.push({t:'swarm',x:20+Math.random()*120,y:y==null?H+20:y,f:.35,n:5+(Math.random()*5|0),ph:Math.random()*6});}
seedDecor();
function drawDecor(){if(G.depth<lastDepth)lastDepth=G.depth;const v=Math.max(0,G.depth-lastDepth)*4;lastDepth=G.depth;
const sp=state==='title'?.3:v;dSpawn-=sp;if(dSpawn<=0){spawnDecor();dSpawn=40+Math.random()*40;}
decor.sort((a,b)=>a.f-b.f);
for(const d of decor){d.y-=sp*d.f;
if(d.t==='mtn'){ctx.globalAlpha=.6;ctx.drawImage(d.im,0,Math.round(d.y));ctx.globalAlpha=1;}
else if(d.t==='swarm'){for(let i=0;i<d.n;i++){const a=d.ph+i*1.3+tick*.02;const gx=d.x+Math.cos(a)*12+Math.sin(tick*.03+i)*4,gy=d.y+Math.sin(a*1.2)*8;ctx.globalAlpha=.5+.3*Math.sin(tick*.08+i);ctx.drawImage(GLOW,Math.round(gx)-6,Math.round(gy)-6);ctx.fillStyle=P.l;ctx.fillRect(Math.round(gx),Math.round(gy),1,1);}ctx.globalAlpha=1;}
else{ctx.globalAlpha=d.t==='wreck'?.75:.9;ctx.drawImage(d.im,Math.round(d.x),Math.round(d.y));ctx.globalAlpha=1;}}
decor=decor.filter(d=>d.y>-100);}
function drawEgg(){if(!egg&&state==='play'&&Math.random()<.0012)egg={side:Math.random()<.5?0:1,t:0,y:40+Math.random()*140};
if(!egg)return;egg.t++;const T=egg.t;let o;if(T<20)o=T/20;else if(T<110)o=1;else o=1-(T-110)/20;if(T>130){egg=null;return;}
const x=egg.side?W-Math.round(o*18):Math.round(o*18)-16,y=Math.round(egg.y+(T>20&&T<110?Math.sin(T*.3)*1.5:0));
ctx.save();if(egg.side){ctx.translate(x+16,y);ctx.scale(-1,1);ctx.drawImage(CLOWN,0,0);}else ctx.drawImage(CLOWN,x,y);ctx.restore();
if(T>30&&T<100){if(T%20<10){ctx.fillStyle=P.w;ctx.fillRect(x+(egg.side?4:10),y+4,1,1);}txt('型！',x+8,y-10,8,P.y);}}
function drawStars(){for(const st of stars){st.l--;for(let i=0;i<3;i++){const a=tick*.2+i*2.1;ctx.fillStyle=i%2?P.y:P.w;const sx=Math.round(st.e.x+8+Math.cos(a)*7),sy=Math.round(st.e.y+1+Math.sin(a)*2);ctx.fillRect(sx,sy,1,1);ctx.fillRect(sx-1,sy,3,1);ctx.fillRect(sx,sy-1,1,3);}}stars=stars.filter(s=>s.l>0&&!s.e.dead&&s.e.y>-20);}
function drawBG(){const d=G.depth;const g=ctx.createLinearGradient(0,0,0,H);const k=Math.min(1,d/2000);
g.addColorStop(0,k<.5?'#73eff7':'#41a6f6');g.addColorStop(.5,'#41a6f6');g.addColorStop(1,k<.5?'#3b5dc9':'#29366f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// light rays
ctx.fillStyle='rgba(255,255,255,0.08)';for(let i=0;i<4;i++){const x=((i*50+tick*.2)%(W+40))-20;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+14,0);ctx.lineTo(x+44,H);ctx.lineTo(x+30,H);ctx.fill();}
drawDecor();const wy=-Math.round((G.depth*4)%32);for(let y=wy;y<H;y+=32){ctx.fillStyle='#2b4a7a';ctx.fillRect(0,y,5+((y/32|0)&1)*3,32);ctx.fillRect(W-6-((y/32|0)&1)*2,y,8,32);ctx.fillStyle='#3d6aa8';ctx.fillRect(0,y,2,32);}}
function draw(){ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;drawBG();
const f=(tick>>3)&3;
if(state==='play'||state==='over'){
for(const e of G.ents){let ex=Math.round(e.x),ey=Math.round(e.y);
if(e.t==='pearl'){ctx.drawImage(PEARL,ex,ey);if(tick%30<4){ctx.fillStyle=P.w;ctx.fillRect(ex+11,ey+4,1,1);}continue;}
if(e.t==='bub'){ctx.drawImage(BUB,ex,ey+Math.round(Math.sin(tick*.1+ex)*1));continue;}
if(e.t==='jelly'){const q=Math.sin((e.ph||0)*3);const sx=1+q*.18,sy=1-q*.22;ctx.globalAlpha=.35;ctx.drawImage(GLOW,ex+2,ey,12,10);ctx.globalAlpha=1;ctx.save();ctx.translate(ex+8,ey+16);ctx.scale(sx,sy);ctx.drawImage(JELLY[f],-8,-16);ctx.restore();continue;}
let flip=e.vx>0;
if(e.t==='fish'){e.fl=e.fl||0;if(!e.fl&&Math.random()<.004)e.fl=24;let k=1;if(e.fl>0){e.fl--;k=Math.cos(e.fl/24*Math.PI*2);if(Math.abs(k)<.15)k=.15*Math.sign(k||1);}
ey+=Math.round(Math.sin(tick*.25+ex*.1)*1.5);ctx.save();ctx.translate(ex+8,ey+8);ctx.scale((flip?-1:1)*k,1);ctx.rotate(Math.sin(tick*.4+ex)*.08);ctx.drawImage(FISH[f],-8,-8);
if((tick+ex*7)%90<5){ctx.fillStyle=P.o;ctx.fillRect(-5,-2,2,2);}ctx.restore();continue;}
if(e.t==='shark'){if(!e.bk){for(const o of G.ents)if(o!==e&&(o.t==='jelly'||o.t==='bub')&&Math.abs(o.x-e.x)<12&&Math.abs(o.y-e.y)<10){e.bk=50;stars.push({e,l:60});break;}}
let rot=0,sxk=1;if(e.bk>0){e.bk--;ex+=Math.round(Math.sin(e.bk*.6)*e.bk/12)*(flip?-1:1);rot=Math.sin(e.bk*.5)*.15;sxk=1+Math.sin(e.bk*.8)*.08;}
ctx.save();ctx.translate(ex+8,ey+8);ctx.rotate(rot);ctx.scale((flip?-1:1)*sxk,1/sxk);ctx.drawImage(SHARK[f],-8,-8);ctx.restore();}}
drawStars();drawEgg();}
for(const p of G.parts){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
if(state!=='title'||true){const bob=Math.round(Math.sin(tick*.1)*1);
if(!(G.inv>0&&(tick>>2)%2)){ctx.fillStyle='rgba(255,255,170,0.18)';ctx.beginPath();ctx.arc(G.x+8,G.y+8+bob,11,0,7);ctx.fill();
ctx.drawImage(SUB[(tick>>(Math.hypot(G.vx,G.vy)>.3?2:3))&3],Math.round(G.x),Math.round(G.y)+bob);}}
for(const p of G.pops)txt(p.s,Math.round(p.x),Math.round(p.y),8,p.s==='O2'?P.c:P.y);
// HUD bar (top, fixed strip — never overlaps play area center)
ctx.fillStyle='rgba(26,28,44,0.75)';ctx.fillRect(0,0,W,13);
for(let i=0;i<3;i++)if(i<G.hp)ctx.drawImage(HEART,2+i*8,4);
ctx.fillStyle=P.k;ctx.fillRect(28,4,42,6);ctx.fillStyle=G.o2<25&&tick%20<10?P.m:P.c;ctx.fillRect(29,5,Math.max(0,G.o2*.4),4);
num(G.score,96,4,P.y);num(Math.floor(G.depth/10)+'m',128,4,P.g);
if(state==='title'){ctx.fillStyle='rgba(26,28,44,0.6)';ctx.fillRect(10,30,140,40);txt('喵喵深海',80,33,16,P.y);txt('尋珠記',80,51,14,P.p);
ctx.fillStyle='rgba(26,28,44,0.6)';ctx.fillRect(10,150,140,72);
txt('執珍珠同魚仔 避水母同鯊魚',80,154,9,P.w);txt('食泡泡補氧氣！開體感可以傾機游',80,166,9,P.c);txt('方向鍵/WASD；手機任何位置拖',80,180,9,P.w);
if(tick%40<28)txt('㩒一下開始',80,196,11,P.y);txt('最高分 '+best,80,210,9,P.g);}
if(state==='over'){ctx.fillStyle='rgba(26,28,44,0.75)';ctx.fillRect(14,150,132,74);txt(G.o2<=0?'冇晒氧氣喇！':'喵～撞親喇！',80,154,12,P.p);
txt('分數 '+G.score,80,172,11,P.y);txt(G.newBest?'新紀錄！':'最高分 '+best,80,187,9,G.newBest?P.g:P.w);if(tick>30&&tick%40<28)txt('㩒一下再玩',80,204,11,P.c);}}
function drawBtn(){if(state==='play')return;ctx.fillStyle=tiltOn?'rgba(56,183,100,0.85)':'rgba(26,28,44,0.7)';ctx.fillRect(BTN.x,BTN.y,BTN.w,BTN.h);ctx.fillStyle=P.w;ctx.fillRect(BTN.x,BTN.y,BTN.w,1);ctx.fillRect(BTN.x,BTN.y+BTN.h-1,BTN.w,1);txt('📱 體感：'+(tiltOn?'開':'關'),80,BTN.y+3,9,P.w);}
function loop(){update();draw();drawBtn();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__game={get tilt(){return tiltOn},start:()=>press(),get state(){return state},get G(){return G}};
</script></body></html>
